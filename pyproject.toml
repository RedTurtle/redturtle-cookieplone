[project]
name = "redturtle-cookieplone"
version = "1.0.0"
description = "Genera add-on Plone con cookieplone e ci applica le convenzioni RedTurtle"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "RedTurtle Technology", email = "sviluppo@redturtle.it" }]
keywords = ["plone", "volto", "cookieplone", "redturtle"]
# Nessuna dipendenza a runtime: solo stdlib, piu' `uvx cookieplone` e
# `uvx repoplone` invocati come sottoprocessi. E' quello che tiene
# l'installazione da git istantanea.
dependencies = []

[project.scripts]
redturtle-cookieplone = "redturtle_cookieplone.cli:main"

[project.urls]
Homepage = "https://github.com/RedTurtle/redturtle-cookieplone"

[tool.uv]
# Senza questo, `uvx --from .` riusa la wheel in cache e ignora le modifiche ai
# sorgenti: uv invalida la build solo sui metadati, e nemmeno --refresh o
# --reinstall lo smuovono. Cosi' invece un `uvx --from .` durante lo sviluppo
# esegue davvero il codice che hai davanti.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }, { file = "src/**/*.tmpl" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# hatchling porta dentro tutto cio' che sta sotto il package, quindi i .tmpl
# dell'overlay ci finiscono da se': sono dati del pacchetto, e senza `align`
# girerebbe installato da git senza i template da scrivere.
packages = ["src/redturtle_cookieplone"]
