[project]
name = "plone-addon-rt"
version = "1.0.0"
description = "Genera add-on Plone con cookieplone e ci applica le convenzioni RedTurtle"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "RedTurtle Technology", email = "sviluppo@redturtle.it" }]
keywords = ["plone", "volto", "cookieplone", "redturtle"]
# Nessuna dipendenza a runtime: solo stdlib, piu' `uvx cookieplone` e
# `uvx repoplone` invocati come sottoprocessi. E' quello che tiene
# l'installazione da git istantanea.
dependencies = []

[project.scripts]
plone-addon-rt = "plone_addon_rt.cli:main"

[project.urls]
Homepage = "https://github.com/RedTurtle/plone-addon-rt"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# hatchling porta dentro tutto cio' che sta sotto il package, quindi i .tmpl
# dell'overlay ci finiscono da se': sono dati del pacchetto, e senza `align`
# girerebbe installato da git senza i template da scrivere.
packages = ["src/plone_addon_rt"]
